name: Deploy VS Code Extension

on:
    create:
    release:
        types: [published]

permissions:
    contents: write

jobs:
    create-release:
        if: github.event_name == 'create' && github.event.ref_type == 'branch' && startsWith(github.event.ref, 'release/v')
        runs-on: ubuntu-latest
        steps:
            - name: Checkout do código
              uses: actions/checkout@v4

            - name: Validar versão da branch de release
              id: release
              env:
                  BRANCH_NAME: ${{ github.event.ref }}
              run: |
                  PACKAGE_VERSION=$(node -p "require('./package.json').version")
                  BRANCH_VERSION="${BRANCH_NAME#release/v}"

                  if [ "$BRANCH_VERSION" != "$PACKAGE_VERSION" ]; then
                    echo "A branch $BRANCH_NAME deve corresponder à versão $PACKAGE_VERSION do package.json."
                    exit 1
                  fi

                  echo "tag=v$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
                  echo "name=release/v$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

            - name: Configurar Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24.14.0
                  cache: 'npm'

            - name: Instalar dependências
              run: npm ci

            - name: Instalar o VSCE globalmente
              run: npm install -g @vscode/vsce

            - name: Empacotar a extensão (.vsix)
              run: vsce package

            - name: Encontrar o arquivo .vsix gerado
              id: get_vsix
              run: |
                  VSIX_FILE=$(ls *.vsix)
                  echo "file_name=$VSIX_FILE" >> "$GITHUB_OUTPUT"

            - name: Criar release no GitHub
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG_NAME: ${{ steps.release.outputs.tag }}
                  RELEASE_NAME: ${{ steps.release.outputs.name }}
                  VSIX_FILE: ${{ steps.get_vsix.outputs.file_name }}
              run: gh release create "$TAG_NAME" "$VSIX_FILE" --target "$GITHUB_SHA" --title "$RELEASE_NAME" --generate-notes

    build-and-release:
        if: github.event_name == 'release' && github.event.action == 'published'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout do código
              uses: actions/checkout@v4

            - name: Configurar Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24.14.0
                  cache: 'npm'

            - name: Instalar dependências
              run: npm ci

            - name: Instalar o VSCE globalmente
              run: npm install -g @vscode/vsce

            - name: Empacotar a extensão (.vsix)
              run: vsce package

            - name: Encontrar o arquivo .vsix gerado
              id: get_vsix
              run: |
                  VSIX_FILE=$(ls *.vsix)
                  echo "file_name=$VSIX_FILE" >> $GITHUB_OUTPUT

            - name: Adicionar .vsix ao download da Release
              uses: softprops/action-gh-release@v2
              with:
                  files: ${{ steps.get_vsix.outputs.file_name }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
